services:

  drupal-lint:
    image: composer:2.7
    profiles: ["lint"]
    working_dir: /src
    command: bash -c "./scripts/run-drupal-lint.sh"
    environment:
      TARGET_DRUPAL_CORE_VERSION: 11
    volumes:
      - .:/src

  drupal-lint-auto-fix:
    image: composer:2.7
    profiles: ["lint"]
    working_dir: /src
    command: bash -c "./scripts/run-drupal-lint-auto-fix.sh"
    environment:
      TARGET_DRUPAL_CORE_VERSION: 11
    volumes:
      - .:/src

  drupal-check:
   image: composer:2.7
   profiles: ["lint"]
   working_dir: /
   command: bash -c "/src/scripts/run-drupal-check.sh"
   tty: true
   environment:
     DRUPAL_RECOMMENDED_PROJECT: 11.x-dev
   volumes:
      - .:/src

  e2e-test:
    image: composer:2.7
    profiles:
      - test
    volumes:
      - .:/app/module:ro
    working_dir: /app/module
    entrypoint: ["bash", "scripts/e2e/run-e2e-tests.sh"]

  phpunit-tests:
    image: composer:2.7
    profiles:
      - test
    working_dir: /
    command: bash -c "/src/scripts/run-phpunit-tests.sh"
    tty: true
    environment:
      DRUPAL_RECOMMENDED_PROJECT: 11.x-dev
    volumes:
      - .:/src
