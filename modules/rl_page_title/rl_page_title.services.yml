services:
  rl_page_title.variant_selector:
    class: Drupal\rl_page_title\Service\TitleVariantSelector
    arguments:
      - '@entity_type.manager'
      - '@rl.experiment_manager'
      - '@rl.cache_manager'
      - '@rl.experiment_registry'
      - '@path.current'
      - '@language_manager'

  rl_page_title.decorator:
    class: Drupal\rl_page_title\Decorator\PageTitleDecorator
    arguments:
      - '@entity_type.manager'
    tags:
      - { name: rl_experiment_decorator }

  Drupal\rl_page_title\Hook\RlPageTitleHooks:
    class: Drupal\rl_page_title\Hook\RlPageTitleHooks
    autowire: true
    arguments:
      - '@rl.runtime_cache'
      - '@rl.experiment_manager'
      - '@entity_type.manager'
      - '@current_user'
      - '@language_manager'
