site_name: 'RL: A/B & Multivariate Testing - Documentation'
site_url: 'https://project.pages.drupalcode.org/rl/'
repo_url: https://git.drupalcode.org/project/rl
repo_name: drupal/rl
edit_uri: /-/edit/1.x/docs/

theme:
  name: material
  features:
    - navigation.footer

plugins:
  - search
  - privacy:
      enabled: !ENV [CI, false]

nav:
  - Home: 'index.md'
  - Getting Started:
      - Installation: 'getting-started/installation.md'
      - Configuration: 'getting-started/configuration.md'
  - API Reference:
      - PHP API: 'api/php.md'
      - JavaScript API: 'api/javascript.md'
      - HTTP API: 'api/http.md'
  - Guides:
      - Drush Commands: 'guides/drush.md'
      - Experiment Decorators: 'guides/decorators.md'
      - Cache Management: 'guides/cache.md'
      - AI Assistant Integration: 'guides/ai-assistant.md'
      - FAQ: 'guides/faq.md'
  - Development:
      - Contributing: 'development/contributing.md'
