rl.reports.experiments:
  path: '/admin/reports/rl'
  defaults:
    _controller: '\Drupal\rl\Controller\ReportsController::experimentsOverview'
    _title: 'RL: A/B Testing'
  requirements:
    _permission: 'view rl reports'

rl.reports.experiment_detail:
  path: '/admin/reports/rl/experiment/{experiment_id}'
  defaults:
    _controller: '\Drupal\rl\Controller\ReportsController::experimentDetail'
    _title_callback: '\Drupal\rl\Controller\ReportsController::experimentDetailTitle'
  requirements:
    _permission: 'view rl reports'
    experiment_id: '.+'

rl.experiment.add:
  path: '/admin/reports/rl/add'
  defaults:
    _form: '\Drupal\rl\Form\ExperimentForm'
    _title: 'Add Experiment'
  requirements:
    _permission: 'administer rl experiments'

rl.experiment.edit:
  path: '/admin/reports/rl/experiment/{experiment_id}/edit'
  defaults:
    _form: '\Drupal\rl\Form\ExperimentForm'
    _title: 'Edit Experiment'
  requirements:
    _permission: 'administer rl experiments'
    experiment_id: '.+'

rl.experiment.delete:
  path: '/admin/reports/rl/experiment/{experiment_id}/delete'
  defaults:
    _form: '\Drupal\rl\Form\ExperimentDeleteForm'
    _title: 'Delete Experiment'
  requirements:
    _permission: 'administer rl experiments'
    experiment_id: '.+'

rl.settings:
  path: '/admin/config/services/reinforcement-learning'
  defaults:
    _form: '\Drupal\rl\Form\RlSettingsForm'
    _title: 'RL: A/B Testing'
  requirements:
    _permission: 'administer site configuration'

rl.settings.disable_event_log:
  path: '/admin/config/services/reinforcement-learning/disable-event-log'
  defaults:
    _form: '\Drupal\rl\Form\DisableEventLogConfirmForm'
    _title: 'Disable Event Log'
  requirements:
    _permission: 'administer site configuration'
