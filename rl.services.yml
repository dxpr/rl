services:
  logger.channel.rl:
    parent: logger.channel_base
    arguments: ['rl']

  rl.snapshot_storage:
    class: Drupal\rl\Storage\SnapshotStorage
    arguments: ['@database', '@datetime.time', '@config.factory']

  rl.experiment_data_storage:
    class: Drupal\rl\Storage\ExperimentDataStorage
    arguments: ['@database', '@datetime.time', '@rl.snapshot_storage']

  rl.arm_data_validator:
    class: Drupal\rl\Service\ArmDataValidator
    arguments: ['@logger.channel.rl']

  rl.ts_calculator:
    class: Drupal\rl\Service\ThompsonCalculator
    public: true

  rl.experiment_manager:
    class: Drupal\rl\Service\ExperimentManager
    arguments: ['@rl.experiment_data_storage', '@rl.ts_calculator', '@config.factory', '@database', '@logger.factory', '@rl.arm_data_validator']

  rl.experiment_registry:
    class: Drupal\rl\Registry\ExperimentRegistry
    arguments: ['@database', '@datetime.time', '@logger.channel.rl']

  rl.experiment_decorator_manager:
    class: Drupal\rl\Decorator\ExperimentDecoratorManager
    tags:
      - { name: service_collector, tag: rl_experiment_decorator, call: addDecorator }

  rl.cache_manager:
    class: Drupal\rl\Service\CacheManager
    arguments: ['@config.factory']

  rl.cache_response_subscriber:
    class: Drupal\rl\EventSubscriber\CacheResponseSubscriber
    tags:
      - { name: event_subscriber }

  rl.analyzer:
    class: Drupal\rl\Service\RlAnalyzer
    arguments: ['@database', '@entity_type.manager']

  rl.endpoint_checker:
    class: Drupal\rl\Service\EndpointChecker
    arguments: ['@state', '@datetime.time', '@extension.list.module', '@http_client', '@request_stack']
